name: Local build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-build:
    name: Local build completed
    runs-on: [self-hosted, macOS, ARM64, todorant-new, local-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Build production web image from a clean linux/amd64 context
        run: |
          podman info >/dev/null 2>&1 || podman machine start
          web_image="localhost/todorant-web-ci:${GITHUB_SHA}"
          trap 'podman image rm -f "$web_image" >/dev/null 2>&1 || true' EXIT
          podman build --no-cache --platform linux/amd64 \
            --file apps/web/Dockerfile \
            --tag "$web_image" \
            .
      - name: Validate migrations and PostgreSQL/WebSocket integration
        run: |
          podman info >/dev/null 2>&1 || podman machine start
          CONTAINER_ENGINE=podman scripts/container-integration.sh
