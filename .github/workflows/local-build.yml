name: Local build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-build:
    name: Local build completed
    runs-on: [self-hosted, macOS, ARM64, todorant-new, local-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Validate migrations and PostgreSQL/WebSocket integration
        run: |
          podman info >/dev/null 2>&1 || podman machine start
          CONTAINER_ENGINE=podman scripts/container-integration.sh
